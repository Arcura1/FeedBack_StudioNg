<nawbarfeed></nawbarfeed>

<!-- Landing tarzı arka plan -->
<div class="d-flex align-items-center justify-content-center min-vh-100"
     style="background: linear-gradient(135deg, #e3f2fd 0%, #ffffff 100%);
            position: relative; overflow: hidden;">

  <!-- Arka plana yumuşak ışık efekti -->
  <div style="
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(187, 222, 251, 0.2) 0%, rgba(255, 255, 255, 0) 70%);
    animation: pulse 15s infinite ease-in-out;
    z-index: 0;
  "></div>

  <!-- Profil Kartı -->
  <div class="container position-relative" style="z-index: 1;">
    <div class="row justify-content-center">
      <div class="col-md-8">

        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          <!-- Başlık: Landing Navbar gibi degrade -->
          <div class="text-white text-center py-4"
               style="background: linear-gradient(135deg, #bbdefb, #90caf9);">
            <h2 class="fw-light m-0">
              <i class="bi bi-person-circle me-2 fs-3"></i>
              Kullanıcı Bilgileri - Profil
            </h2>
          </div>

          <!-- Bilgi Alanı -->
          <div class="card-body px-5 py-4" style="background: linear-gradient(135deg, #ffffff, #e3f2fd);">
            <div class="mb-3">
              <label class="text-primary fw-semibold">Kullanıcı ID:</label>
              <div class="fs-5 text-dark">{{ user.id }}</div>
            </div>
            <div class="mb-3">
              <label class="text-primary fw-semibold">Kullanıcı Adı:</label>
              <div class="fs-5 text-dark">{{ user.firstName }}</div>
            </div>
            <div class="mb-3">
              <label class="text-primary fw-semibold">Kullanıcı Rolü:</label>
              <div class="fs-5 text-dark">{{ user.role }}</div>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>

<!-- Pulse animasyonu için -->
<style>
  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.05); opacity: 0.7; }
    100% { transform: scale(1); opacity: 0.5; }
  }
</style>
