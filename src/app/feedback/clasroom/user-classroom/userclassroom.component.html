<div class="container mt-4">
  <h3>👤 Kullanıcının Sınıfını Değiştir</h3>

  <!-- Kullanıcı seçimi (native select) -->
  <div class="form-group mb-3">
    <label for="userSelect"><strong>Kullanıcı Seç</strong></label>
    <div class="input-group">
      <input type="text" class="form-control" placeholder="Kullanıcı Ara..." [(ngModel)]="userSearchText" (input)="filterUsers()">
      <select id="userSelect" class="form-select" [(ngModel)]="selectedUserId" (change)="onUserChange()">
        <option [value]="null">-- Kullanıcı Seçin --</option>
        <option *ngFor="let user of filteredUsers" [value]="user.id">
          {{ user.firstName }} {{ user.lastName }}
        </option>
      </select>
    </div>
  </div>

  <!-- Mevcut sınıf bilgisi -->
  <div *ngIf="selectedUserClassroomId !== null" class="mb-3">
    <strong>📌 Şu Anki Sınıf:</strong> {{ selectedUserClassroomId }}
  </div>

  <!-- Yeni sınıf seçimi (native select) -->
  <div class="form-group mb-3">
    <label for="classroomSelect"><strong>Yeni Sınıf Seç</strong></label>
    <div class="input-group">
      <input type="text" class="form-control" placeholder="Sınıf Ara..." [(ngModel)]="classroomSearchText" (input)="filterClassrooms()">
      <select id="classroomSelect" class="form-select" [(ngModel)]="newClassroomId">
        <option [value]="null">-- Sınıf Seçin --</option>
        <option *ngFor="let c of filteredClassrooms" [value]="c.id">
          {{ c.name }}
        </option>
      </select>
    </div>
  </div>

  <!-- Güncelleme butonu -->
  <button class="btn btn-primary" (click)="updateUserClassroom()">Sınıfı Güncelle</button>

  <!-- Bilgi mesajı -->
  <div class="alert alert-info mt-3" *ngIf="message">
    {{ message }}
  </div>
</div>

<!-- Yeni kullanıcı sınıfa ekle -->
<div class="container mt-4">
  <h3>➕ Yeni Kullanıcıyı Sınıfa Ekle</h3>
  <div class="form-group mb-3">
    <label for="newUserSelect"><strong>Yeni Kullanıcı Seç</strong></label>
    <div class="input-group">
      <input type="text" class="form-control" placeholder="Kullanıcı Ara..." [(ngModel)]="newUserSearchText" (input)="filterNewUsers()">
      <select id="newUserSelect" class="form-select" [(ngModel)]="newUserId">
        <option [value]="null">-- Kullanıcı Seçin --</option>
        <option *ngFor="let user of filteredNewUsers" [value]="user.id">
          {{ user.firstName }} {{ user.lastName }}
        </option>
      </select>
    </div>
  </div>

  <div class="form-group mb-3">
    <label for="newUserClassroom"><strong>Sınıf Seç</strong></label>
    <div class="input-group">
      <input type="text" class="form-control" placeholder="Sınıf Ara..." [(ngModel)]="newUserClassroomSearchText" (input)="filterNewClassrooms()">
      <select id="newUserClassroom" class="form-select" [(ngModel)]="newUserClassroomId">
        <option [value]="null">-- Sınıf Seçin --</option>
        <option *ngFor="let c of filteredNewClassrooms" [value]="c.id">
          {{ c.name }}
        </option>
      </select>
    </div>
  </div>

  <button class="btn btn-primary" (click)="addUserToClassroom()">Yeni Kullanıcıyı Sınıfa Ekle</button>

  <div class="alert alert-info mt-3" *ngIf="addMessage">
    {{ addMessage }}
  </div>
</div>
