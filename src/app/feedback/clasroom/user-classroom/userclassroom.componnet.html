<div class="container mt-4">
  <h2 class="mb-4 text-primary">Sınıf Kullanıcı Yönetimi</h2>

  <form (ngSubmit)="onSubmit()" class="row g-3">
    <!-- Kullanıcı Arama -->
    <div class="col-md-6">
      <label class="form-label">Kullanıcı Ara</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="searchText"
        name="searchText"
        (input)="onSearchChange()"
        placeholder="İsim veya soyisim girin..."
      />
    </div>

    <!-- Kullanıcı Dropdown -->
    <div class="col-md-6" *ngIf="filteredUsers.length > 0">
      <label class="form-label">Kullanıcı Seç</label>
      <select
        class="form-select"
        [(ngModel)]="formData.userId"
        name="userId"
        required
      >
        <option *ngFor="let user of filteredUsers" [value]="user.id">
          {{ user.firstName }} {{ user.lastName }}
        </option>
      </select>
    </div>

    <!-- Sınıf Arama -->
    <div class="col-md-6">
      <label class="form-label">Sınıf Ara</label>
      <input
        type="text"
        class="form-control"
        [formControl]="searchControl"
        placeholder="Sınıf adı girin..."
      />
    </div>

    <!-- Sınıf Seçimi -->
    <div class="col-md-6">
      <label class="form-label">Sınıf Seç</label>
      <select
        class="form-select"
        [(ngModel)]="formData.classroomId"
        name="classroomId"
        required
      >
        <option *ngFor="let classroom of classrooms" [value]="classroom.id">
          {{ classroom.name }}
        </option>
      </select>
    </div>

    <!-- Buton -->
    <div class="col-12">
      <button type="submit" class="btn btn-success w-100">
        {{ formData.id ? 'Güncelle' : 'Ekle' }}
      </button>
    </div>
  </form>

  <hr class="my-4" />

  <h4 class="mb-3">Kayıtlı Kullanıcılar</h4>
  <ul class="list-group">
    <li
      class="list-group-item d-flex justify-content-between align-items-center"
      *ngFor="let user of classroomUsers"
    >
      <div>
        <strong>Sınıf:</strong> {{ user.classroomId }} |
        <strong>Kullanıcı:</strong> {{ user.userId }}
      </div>
      <div>
        <button
          class="btn btn-outline-primary btn-sm me-2"
          (click)="editUser(user)"
        >
          Düzenle
        </button>
        <button
          class="btn btn-outline-danger btn-sm"
          (click)="deleteUser(user.id)"
        >
          Sil
        </button>
      </div>
    </li>
  </ul>
</div>
