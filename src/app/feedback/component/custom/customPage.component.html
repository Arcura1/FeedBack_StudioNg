<!-- ORGANIZATION Accordion -->
<div class="accordion-item">
  <div class="accordion-header" (click)="toggleAccordion('organization')">
    <span><i class="icon fa fa-sitemap"></i> Organizasyon</span>
    <span class="arrow" [class.open]="selectedSection === 'organization'">▼</span>
  </div>
  <div class="accordion-body" [class.show]="selectedSection === 'organization'">

    <!-- Organizasyon Seçici -->
    <div class="form-group" *ngIf="organizationAuthorities.length > 0">
      <label for="orgSelect">Bir organizasyon seçin:</label>
      <select class="form-control" id="orgSelect" #orgSelect (change)="onSelectOrganization(orgSelect.value)">
        <option [value]="''">Seçiniz</option>
        <option *ngFor="let authority of organizationAuthorities" [value]="authority.organization.id">
          {{ authority.organization.name }}
        </option>
      </select>
    </div>

    <form (ngSubmit)="saveOrganization()" #orgForm="ngForm" class="mb-4" *ngIf="organization">
      <input type="hidden" [(ngModel)]="organization.id" name="id">

      <div class="form-group">
        <label for="name">İsim:</label>
        <input type="text" class="form-control" id="name" placeholder="Organization ismi" required
               [(ngModel)]="organization.name" name="name">
      </div>

      <div class="form-group">
        <label for="address">Adres:</label>
        <input type="text" class="form-control" id="address" placeholder="Adres" required
               [(ngModel)]="organization.address" name="address">
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" class="form-control" id="email" placeholder="Email" required
               [(ngModel)]="organization.email" name="email">
      </div>

      <button type="submit" class="btn btn-primary">
        {{ organization.id ? 'Güncelle' : 'Kaydet' }}
      </button>
      <button type="button" class="btn btn-secondary ml-2" (click)="resetForm()">Temizle</button>
    </form>

    <div *ngIf="!organizationAuthorities.length">
      <p>Yetkili organizasyon verisi bulunamadı.</p>
    </div>
  </div>
</div>
