<nawbarfeed></nawbarfeed>

<div class="min-vh-100 d-flex align-items-center justify-content-center pdf-edit-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12">

        <!-- PDF Card -->
        <div class="pdf-card shadow-lg text-white">
          <h2 class="text-center mb-4 fw-bold">
            <i class="bi bi-file-earmark-pdf me-2"></i>PDF Editör
          </h2>

          <!-- PDF ID ve HW ID -->
          <p class="text-light">PDF ID: <strong>{{ pdfId }}</strong></p>
          <p class="text-light">Homework ID: <strong>{{ homeworkId }}</strong></p>

          <!-- X/Y -->
          <div class="mb-3">
            <label class="form-label text-light">X Değeri: <strong>{{ pdfX.toFixed(2) }}</strong></label><br />
            <label class="form-label text-light">Y Değeri: <strong>{{ pdfY.toFixed(2) }}</strong></label>
          </div>

          <!-- Form -->
          <form (ngSubmit)="onSubmit()" #myForm="ngForm" class="mb-4">
            <div class="input-group">
              <input type="text" class="form-control" name="metin" [(ngModel)]="metin" placeholder="Metin giriniz" required>
              <input type="text" class="form-control" name="title" [(ngModel)]="title" placeholder="Başlık giriniz" required>
              <button type="submit" class="btn btn-light" [disabled]="!myForm.form.valid">Gönder</button>
            </div>
          </form>

          <!-- Butonlar -->
          <div class="d-flex flex-wrap gap-2 mb-4">
            <button class="btn btn-outline-light" (click)="pageChangeBackvard()">Geri</button>
            <button class="btn btn-outline-light" (click)="pageChangeForvard()">İleri</button>
            <button class="btn btn-warning" (click)="higlihtMode()">Highlight</button>
            <button class="btn btn-info" (click)="noteMode()">Note</button>
            <button class="btn btn-success" (click)="download($event)">Download PDF</button>
            <button class="btn btn-outline-success" (click)="downloadWithoutButton($event)">Download Without Buttons</button>
            <button class="btn btn-danger" (click)="cizgiMode($event)">Çizgi</button>
            <button class="btn btn-danger" (click)="deleteAllNotes()">Tüm Notları Sil</button>
            <button class="btn btn-danger" (click)="deleteAllHiglights()">Tüm Highlightları Sil</button>
          </div>

          <!-- PDF Canvas -->
          <div id="pdf-viewer" class="border rounded bg-white p-3 overflow-auto" style="width: max-content" #canvasContainer>
            <canvas id="pdf-render"
                    #pdfCanvas
                    (click)="pdfLocationUpdate($event)"
                    (mouseup)="mouseup($event)"
                    (mousemove)="mouseMove($event)"
                    (mousedown)="mouseDown($event)">
            </canvas>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <p id="modalMessage"></p>
  </div>
</div>
