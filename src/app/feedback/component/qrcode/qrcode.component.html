<div class="qrcode-container">
  <h3 class="qrcode-title">Rol Seç ve QR Kodunu Oluştur</h3>

  <div class="button-group">
    <button *ngFor="let role of roles" (click)="updateUrl(role)" class="qr-button">
      {{ role }}
    </button>
  </div>

  <div class="qrcode-box" *ngIf="targetUrl">
    <p class="url-text">{{ targetUrl }}</p>
    <qrcode
      [qrdata]="targetUrl"
      [width]="256"
      [errorCorrectionLevel]="'M'">
    </qrcode>
  </div>
</div>
