<div class="user-management">
  <h2>User Management</h2>

  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Update Role</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let user of users">
      <td>{{ user.id }}</td>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
      <td>
        <select [(ngModel)]="user.role">
          <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
        </select>
        <button (click)="updateRole(user, user.role)">Update Role</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
