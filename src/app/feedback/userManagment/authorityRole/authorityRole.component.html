<div class="container mt-4">
  <h3 class="mb-4">Role & Authority Mapping</h3>

  <form (ngSubmit)="save()" class="row g-3 mb-4">
    <!-- ROLE Seçimi -->
    <!-- ROLE SEARCH & SELECT -->
    <div class="col-md-4 position-relative">
      <input
        type="text"
        class="form-control mb-2"
        placeholder="Role ara..."
        (input)="onRoleSearch($event)"
        (focus)="onRoleSearch($event)"
        (blur)="hideSuggestions()"
        [attr.autocomplete]="'off'"
      />

      <select
        *ngIf="roles.length > 0"
        [(ngModel)]="newRelation.roleId"
        (change)="selectroleType($event)"
        name="roleId"
        class="form-control"
      >
        <option [value]="null">-- Rol seçin --</option>
        <option *ngFor="let role of roles" [value]="role.id">
          {{ role.name }}
        </option>
      </select>


    </div>

    <!-- AUTHORITY TYPE -->
    <div class="col-md-3">
      <select [(ngModel)]="selectedAuthorityType" name="authorityType" class="form-control" (change)="selectAuthorityType($event)">
        <option *ngFor="let option of authorityTypeOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>

    <!-- AUTHORITY SEARCH -->
    <div class="col-md-5 position-relative">
      <input
        type="text"
        class="form-control"
        placeholder="Authority Name"
        [(ngModel)]="authoritySearchTest"
        (input)="onAuthorityNameChange()"
        (blur)="hideSuggestions()"
        (focus)="onAuthorityNameChange()"
        [attr.autocomplete]="'off'"
        name="authorityName"
        required
      />

      <ul class="list-group position-absolute w-100 zindex-dropdown mt-1" *ngIf="showSuggestions && filteredAuthorities.length > 0">
        <li
          class="list-group-item list-group-item-action"
          *ngFor="let authority of filteredAuthorities"
          (click)="selectAuthority(authority)"
          style="cursor: pointer"
        >
          {{ authority.name }}
        </li>
      </ul>
    </div>

    <!-- SUBMIT BUTTON -->
    <div class="col-md-2 d-grid">
      <button class="btn btn-primary" type="submit">
        {{ selectedId ? 'Update' : 'Add' }}
      </button>
    </div>

    <div class="col-12 d-flex justify-content-end">
      <button type="button" class="btn btn-secondary btn-sm" (click)="reset()">Reset</button>
    </div>
  </form>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>Role ID</th>
      <th>Authority ID</th>
      <th style="width: 150px;">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let item of roleAuthorities">
      <td>{{ item.roleId }}</td>
      <td>{{ item.authorityId }}</td>
      <td>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-warning" (click)="edit(item)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="delete(item.id!)">Delete</button>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
</div>
