<div class="container mt-4">
  <h2 class="mb-4">Role Management</h2>

  <!-- Form Section -->
  <form #roleForm="ngForm" (ngSubmit)="saveRole()" class="mb-4">
    <div class="row g-3">
      <div class="col-md-4">
        <label for="name" class="form-label">Role Name</label>
        <input
          type="text"
          id="name"
          class="form-control"
          [(ngModel)]="newRole.name"
          name="name"
          required
        />
      </div>

      <div class="col-md-4">
        <label for="description" class="form-label">Description</label>
        <input
          type="text"
          id="description"
          class="form-control"
          [(ngModel)]="newRole.description"
          name="description"
          required
        />
      </div>


      <div class="col-md-4" > <!-- role seçilince açılacak -->
        <label class="form-label">Organization</label>
        <input type="text" (input)="onInputChangeadd($event)" [(ngModel)]="organizationTextAdd" placeholder="Organizasyon ara..." />

        <select *ngIf="organizationsa.length > 0" [(ngModel)]="newRole.organizationId" name="organizationId" class="form-control" required (change)="onOrganizationChange()">
          <option *ngFor="let organizationa of organizationsa" [value]="organizationa.id">
            {{ organizationa.name }}
          </option>
        </select>
      </div>

      <div class="col-md-4">
        <label for="roleType" class="form-label">Role Type</label>
        <select
          id="roleType"
          class="form-select"
          [(ngModel)]="newRole.roleTypeEnum"
          name="roleTypeEnum"
          disabled
        >
          <option [value]="'CUSTOM'">CUSTOM</option>
        </select>
      </div>
    </div>

    <div class="mt-3">
      <button
        type="submit"
        class="btn btn-primary me-2"
        [disabled]="!roleForm.valid"
      >
        {{ selectedRoleId ? 'Update' : 'Create' }} Role
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        (click)="resetForm()"
      >
        Reset
      </button>
    </div>
  </form>

  <!-- Query Section -->
  <h4>Role Query</h4>
  <div class="row g-3 mb-3">
    <div class="col-md-4">
      <input [(ngModel)]="query.name" class="form-control" placeholder="Name" />
    </div>
    <div class="col-md-4">
      <input [(ngModel)]="query.description" class="form-control" placeholder="Description" />
    </div>
    <div class="col-md-4" > <!-- role seçilince açılacak -->
      <label class="form-label">Organization</label>
      <input type="text" (input)="onInputChange($event)" [(ngModel)]="organizationText" placeholder="Organizasyon ara..." />

      <select *ngIf="organizations.length > 0" [(ngModel)]="query.organizationId" name="organizationId" class="form-control" (change)="onOrganizationChange()">
        <option *ngFor="let organization of organizations" [value]="organization.id">
          {{ organization.name }}
        </option>
      </select>
    </div>


    <div class="col-md-4">
      <select [(ngModel)]="query.roleTypeEnum" class="form-select">
        <option value="">-- Select Role Type --</option>
        <option *ngFor="let type of roleTypes" [value]="type">{{ type }}</option>
      </select>
    </div>
  </div>
  <div class="mb-3">
    <button class="btn btn-primary me-2" (click)="searchRoles()">Search</button>
    <button class="btn btn-secondary" (click)="clearFilters()">Clear</button>
  </div>

  <!-- Roles Table -->
  <table class="table table-bordered table-striped">
    <thead class="table-light">
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Role Type</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <ng-container *ngFor="let role of roles">
      <tr *ngIf="role.organizationId !== null && role.organizationId !== undefined">
        <td>{{ role.name }}</td>
        <td>{{ role.description }}</td>
        <td>{{ role.roleTypeEnum }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2" (click)="editRole(role)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteRole(role.id!)">Delete</button>
        </td>
      </tr>
    </ng-container>
    </tbody>
  </table>
</div>
