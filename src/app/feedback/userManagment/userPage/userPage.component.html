<div class="container mt-4">
  <h2 class="mb-3">{{ isUpdateMode ? 'Kullanıcı Güncelle' : 'Yeni Kullanıcı Oluştur' }}</h2>

  <form (ngSubmit)="isUpdateMode ? updateUser() : createUser()">
    <div class="row mb-2">
      <div class="col-md-4">
        <input [(ngModel)]="userForm.firstName" name="firstName" class="form-control" placeholder="Ad" required/>
      </div>
      <div class="col-md-4">
        <input [(ngModel)]="userForm.lastName" name="lastName" class="form-control" placeholder="Soyad" required/>
      </div>
      <div class="col-md-4">
        <input [(ngModel)]="userForm.email" name="email" type="email" class="form-control" placeholder="Email"
               required/>
      </div>
      <div class="col-md-4">
        <input type="text"  (input)="onInputChange($event)" placeholder="Organizasyon ara..."/>

        <select *ngIf="organizations.length > 0"  [(ngModel)]="userForm.roleId"  name="organizationId" type="organizationId" class="form-control">
          <option *ngFor="let organization of organizations" [value]="organization.id">
            {{ organization.name }}
          </option>
        </select>

      </div>
    </div>

    <div class="row mb-2">
      <div class="col-md-4">
        <input [(ngModel)]="userForm.password" name="password" type="password" class="form-control" placeholder="Şifre"
               [required]="!isUpdateMode"/>
      </div>

      <div class="col-md-4">
        <select [(ngModel)]="userForm.role" name="role" class="form-select" required (change)="onRoleChange()">
          <option value="">-- Rol Seçin --</option>
          <option *ngFor="let type of roleTypes" [value]="type">{{ type }}</option>
        </select>
      </div>

      <div class="col-md-4" *ngIf="userForm.role === 'CUSTOM'">
        <input [(ngModel)]="userForm.role" name="customRole" class="form-control" placeholder="Özel Rol Giriniz"
               required/>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success">{{ isUpdateMode ? 'Güncelle' : 'Oluştur' }}</button>
      <button type="button" class="btn btn-secondary" (click)="resetForm()">Temizle</button>
    </div>
  </form>

  <hr class="my-4"/>

  <h4>Mevcut Kullanıcılar</h4>
  <table class="table table-bordered table-striped">
    <thead>
    <tr>
      <th>Ad</th>
      <th>Soyad</th>
      <th>Email</th>
      <th>Rol</th>
      <th>İşlemler</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let user of users">
      <td>{{ user.firstName }}</td>
      <td>{{ user.lastName }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
      <td>
        <button class="btn btn-sm btn-warning me-1" (click)="editUser(user)">Düzenle</button>
        <button class="btn btn-sm btn-danger" (click)="deleteUser(user.id)">Sil</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
